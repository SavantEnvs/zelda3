# selftest config: exercises sections, comments, quoting, !include and key arrays
[General]
Autosave = 1
ExtendedAspectRatio = 16:9
[Graphics]
WindowSize = 800x600
WindowScale = 4   # trailing comment
OutputMethod = OpenGL
Shader = presets/crt.glslp
[Sound]
AudioFreq = 32000
AudioChannels = 1
MSUVolume = 75%
EnableMSU = opuz
!include extra.ini
[KeyMap]
Controls = w, s, a, d, Shift+q, e, j, k, u, i, o, p
[Features]
CarryMoreRupees = 1
